[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.26"
evm_version = "cancun"          # transient storage (EIP-1153) is used on the swap path
optimizer = true
optimizer_runs = 200
via_ir = true

ffi = true                      # backtest harness reads the replay fixture
gas_reports = ["*"]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 48
fail_on_revert = false

[rpc_endpoints]
base = "https://mainnet.base.org"
unichain = "https://mainnet.unichain.org"
